[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webvsdesk"
version = "0.1.0"
description = "Didactic minimal example: Web app vs Desktop app in Python"
requires-python = ">=3.8"
dependencies = [
    "flask>=2.0.0",
]

[project.scripts]
webapp = "webvsdesk.webapp:main"
deskapp = "webvsdesk.deskapp:main"
